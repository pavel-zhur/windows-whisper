# Whisper App Transformation Profiles
# Each profile can be triggered with Ctrl+[number]

profiles:
  1:
    name: "Transcribe"
    description: "Raw Whisper transcription, no LLM processing"
    whisper:
      model: "whisper-1"

  2:
    name: "Translate to English"
    description: "Transcribe and translate to English"
    whisper:
      model: "whisper-1"
    transformation:
      model: "gpt-4"
      prompt: "Translate this text to English. Produce only the translation, nothing else."

  3:
    name: "Respond"
    description: "LLM responds to what was said"
    whisper:
      model: "whisper-1"
    transformation:
      model: "gpt-4"
      prompt: "The following text is something the user just said. Respond to it naturally and helpfully. Produce only your response, nothing else."
